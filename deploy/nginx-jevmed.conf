# /etc/nginx/sites-available/jevmed.trilumi.xyz
#
#   sudo ln -s /etc/nginx/sites-available/jevmed.trilumi.xyz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run this file WITHOUT the TLS block first, then let certbot add it:
#   sudo certbot --nginx -d jevmed.trilumi.xyz
# Certbot rewrites this file in place, adding the listen 443 / ssl_certificate
# lines and the port-80 redirect.

upstream jevmed_app {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name jevmed.trilumi.xyz;

    # Certbot writes its challenge here; everything else is proxied.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass         http://jevmed_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # The assistant replies as a server-sent-event stream. Without these three
    # lines nginx buffers the whole answer and the user watches a spinner until
    # the model has finished, which is exactly the opposite of streaming.
    location /api/chat {
        proxy_pass            http://jevmed_app;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_set_header      Connection        "";
        proxy_buffering       off;
        proxy_cache           off;
        proxy_read_timeout    300s;
        chunked_transfer_encoding on;
    }

    # Hashed asset filenames — safe to cache hard.
    location /assets/ {
        proxy_pass       http://jevmed_app;
        proxy_set_header Host $host;
        expires          1y;
        add_header       Cache-Control "public, immutable";
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/jevmed.access.log;
    error_log  /var/log/nginx/jevmed.error.log;
}
