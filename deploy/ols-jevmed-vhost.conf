# OpenLiteSpeed vhost for jevmed.trilumi.xyz
#
# Installed by setup-vps.sh to:
#   /usr/local/lsws/conf/vhosts/jevmed.trilumi.xyz/vhost.conf
#
# This host runs CyberPanel + OpenLiteSpeed, which owns :80 and :443. There is
# no nginx here and there must not be — every other trilumi.xyz site is served
# by lsws off the same two ports.
#
# Everything is proxied to the Node process on 127.0.0.1:8787. The docRoot is a
# near-empty stub that exists only so lsws has somewhere to root the vhost and
# write its logs.

docRoot                   /home/trilumi.xyz/jevmed
vhDomain                  $VH_NAME
adminEmails               hello@trilumi.xyz
enableGzip                1
enableIpGeo               0

errorlog $VH_ROOT/logs/jevmed.error_log {
  useServer               0
  logLevel                WARN
  rollingSize             10M
}

accesslog $VH_ROOT/logs/jevmed.access_log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                10
  compressArchive         1
}

# ── The Node application ─────────────────────────────────────────────────────
# respBuffer 0 is the one line that must not be removed. The assistant answers
# as a server-sent-event stream; with response buffering on, lsws holds the
# whole reply until the model finishes and the reader watches a spinner instead
# of text appearing. This is the OpenLiteSpeed equivalent of nginx's
# `proxy_buffering off`.
extprocessor jevmed_app {
  type                    proxy
  address                 127.0.0.1:8787
  maxConns                100
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      60
  respBuffer              0
}

# ── Let's Encrypt HTTP-01 ────────────────────────────────────────────────────
# Declared before the catch-all for readability; lsws matches the longest URI
# prefix regardless of order, so this wins over `/` either way. acme.sh writes
# its token into this shared webroot — the same one every other trilumi.xyz
# subdomain validates against.
context /.well-known/acme-challenge/ {
  location                /usr/local/lsws/Example/html/.well-known/acme-challenge/
  allowBrowse             1

  rewrite  {
    enable                0
  }
}

# ── Everything else ──────────────────────────────────────────────────────────
context / {
  type                    proxy
  handler                 jevmed_app
  addDefaultCharset       off
}
